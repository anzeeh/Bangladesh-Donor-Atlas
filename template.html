<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IATI Bangladesh Donor Atlas</title>
<style>
  :root {
    --bg: #f4ede0; --paper: #faf6ec; --ink: #1a1612; --muted: #6b6356;
    --rule: #d8cfbd; --accent: #a8321f; --accent2: #c97b3e; --accent3: #3d5a3d;
    --accent4: #5b6b8c; --accent5: #8b6f47;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: Georgia, "Times New Roman", serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .mono { font-family: "SF Mono", "JetBrains Mono", "Consolas", "Menlo", monospace; }
  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; }
  ::selection { background: rgba(168,50,31,0.2); }
  .kicker { font-size: 10px; letter-spacing: 0.18em; color: var(--accent); text-transform: uppercase; }
  .kicker-mono { font-family: "SF Mono","JetBrains Mono","Consolas","Menlo",monospace; font-size: 10px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
  header.masthead { border-bottom: 2px solid var(--ink); padding: 32px 48px 20px; background: var(--paper); }
  .mast-row { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; flex-wrap: wrap; }
  h1.title { font-size: clamp(32px, 5vw, 52px); font-weight: 600; line-height: 1.0; margin: 0; letter-spacing: -0.02em; }
  h1.title em { font-weight: 400; color: var(--accent); font-style: italic; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); border-bottom: 1px solid var(--rule); background: var(--paper); }
  .stat-cell { padding: 20px 24px; border-right: 1px solid var(--rule); }
  .stat-cell:last-child { border-right: none; }
  .stat-value { font-size: 28px; font-weight: 600; line-height: 1; letter-spacing: -0.01em; }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 6px; font-style: italic; }
  nav.tabs { display: flex; gap: 0; padding: 0 48px; border-bottom: 1px solid var(--rule); background: var(--paper); flex-wrap: wrap; }
  nav.tabs button { background: none; border: none; padding: 14px 20px; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav.tabs button.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  main { padding: 32px 48px 64px; }
  .section-title { margin-bottom: 16px; }
  .section-title h2 { font-size: 26px; font-weight: 600; margin: 4px 0 0; letter-spacing: -0.01em; line-height: 1.1; }
  .panel { background: var(--paper); border: 1px solid var(--rule); }
  .grid-2col { display: grid; grid-template-columns: 2fr 1fr; gap: 32px; }
  .grid-topics { display: grid; grid-template-columns: 280px 1fr; gap: 28px; align-items: start; }
  @media (max-width: 860px) {
    .grid-2col, .grid-topics { grid-template-columns: 1fr; }
    header.masthead, nav.tabs, main, footer { padding-left: 20px; padding-right: 20px; }
    .stat-cell { border-right: none; border-bottom: 1px solid var(--rule); }
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { padding: 10px 16px; text-align: left; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; font-family: "SF Mono","JetBrains Mono","Consolas","Menlo",monospace; }
  th.right { text-align: right; }
  td { padding: 10px 16px; }
  td.right { text-align: right; }
  input, select { padding: 8px 12px; border: 1px solid var(--rule); background: var(--paper); font-family: inherit; font-size: 13px; color: var(--ink); outline: none; }
  .tag { font-size: 9px; padding: 1px 6px; font-family: "SF Mono","JetBrains Mono","Consolas","Menlo",monospace; letter-spacing: 0.02em; display: inline-block; }
  .pill { font-size: 11px; padding: 3px 8px; font-family: "SF Mono","JetBrains Mono","Consolas","Menlo",monospace; display: inline-block; }
  .act-card { background: var(--paper); border: 1px solid var(--rule); padding: 14px 18px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; width: 100%; text-align: left; color: var(--ink); transition: border-color 0.15s; }
  .act-card:hover { border-color: var(--ink); }
  .act-title { font-size: 13px; font-weight: 600; line-height: 1.35; margin-bottom: 4px; }
  .act-meta { font-size: 11px; color: var(--muted); }
  .theme-btn { display: block; width: 100%; text-align: left; padding: 10px 16px; background: transparent; border: none; border-left: 3px solid transparent; border-bottom: 1px dotted var(--rule); color: var(--ink); }
  .theme-btn.active { background: var(--bg); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(26,22,18,0.55); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 24px; }
  .modal { background: var(--paper); max-width: 820px; width: 100%; max-height: 92vh; overflow-y: auto; border: 2px solid var(--ink); box-shadow: 0 24px 48px rgba(26,22,18,0.25); }
  .modal-close { position: absolute; top: 20px; right: 20px; background: none; border: none; padding: 6px; color: var(--muted); font-size: 22px; line-height: 1; }
  .bar-track { height: 4px; background: var(--rule); position: relative; }
  .bar-fill { height: 100%; }
  .muted { color: var(--muted); }
  .prose p { font-size: 14px; line-height: 1.7; color: var(--muted); }
  .prose h3 { font-size: 18px; font-weight: 600; margin-top: 24px; margin-bottom: 8px; color: var(--ink); }
  footer { border-top: 1px solid var(--rule); padding: 20px 48px; background: var(--paper); display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); flex-wrap: wrap; gap: 12px; font-family: "SF Mono","JetBrains Mono","Consolas","Menlo",monospace; }
</style>
</head>
<body>
<div id="root"></div>
<script id="atlas-data" type="application/json">/*__DATA__*/</script>
<script>
(function () {
  "use strict";
  var _RAW = JSON.parse(document.getElementById('atlas-data').textContent);

  var SECTOR_COLORS = {
    'Humanitarian': '#a8321f', 'Health & Population': '#c97b3e', 'Government & Civil Society': '#5b6b8c',
    'Water & Sanitation': '#3d7a8b', 'Education': '#8b6f47', 'Agriculture & Rural Dev.': '#3d5a3d',
    'Environment': '#6b8e4e', 'Energy': '#b8923a', 'Multisector / Cross-cutting': '#7a5c8b',
    'Other Social Infrastructure': '#9b7b6e', 'Banking & Finance': '#2c4a5e', 'Industry & Trade': '#a85a3f',
    'Trade Policy': '#c4633e', 'Transport & Storage': '#4a5a6b', 'Communications': '#7c8a9b',
    'Business & Other Services': '#8b7355', 'Admin Costs / Other': '#8a8273', 'Other / Unspecified': '#b8aa92',
    'Budget Support / Debt': '#5e4a3c'
  };
  var ORG_TYPE_COLORS = {
    'Government': '#a8321f', 'Multilateral': '#5b6b8c', 'International NGO': '#3d5a3d', 'National NGO': '#6b8e4e',
    'Foundation': '#c97b3e', 'Public-Private Partnership': '#7a5c8b', 'Private Sector': '#8b6f47',
    'Academic / Research': '#4a5a6b', 'Other Public Sector': '#9b7b6e', 'Other': '#8a8273'
  };
  var THEME_COLORS = {
    climate: '#3d5a3d', wee_gender: '#a8321f', governance: '#5b6b8c', rohingya: '#c4633e', humanitarian: '#a85a3f',
    drm_pfm: '#2c4a5e', rmg_trade: '#8b6f47', blended_msme: '#7a5c8b', social_protection: '#9b7b6e',
    energy: '#b8923a', health: '#c97b3e', education: '#8b6f47', wash: '#3d7a8b', agriculture: '#6b8e4e',
    transport: '#4a5a6b', climate_finance: '#3d5a3d'
  };

  function fmt$(n) {
    if (!n) return '$0';
    if (n >= 1e9) return '$' + (n/1e9).toFixed(2) + 'B';
    if (n >= 1e6) return '$' + (n/1e6).toFixed(1) + 'M';
    if (n >= 1e3) return '$' + (n/1e3).toFixed(0) + 'K';
    return '$' + n.toFixed(0);
  }
  function fmtNum(n) { return new Intl.NumberFormat('en-US').format(n); }
  function fmtCompact(n) {
    if (n === null || n === undefined) return '—';
    if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(1) + 'M';
    if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(1) + 'K';
    return Number.isInteger(n) ? String(n) : n.toFixed(1);
  }
  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function color(map, k) { return map[k] || '#8a8273'; }
  function hexA(hex, alpha) {
    var h = hex.replace('#','');
    var r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }
  function clip(s, n) { s = String(s); return s.length > n ? s.slice(0, Math.max(1,n-1)) + '…' : s; }

  var data = {
    summary: _RAW.summary,
    orgs: _RAW.orgs.map(function (o) { return { name: o.n, type: o.t, activities: o.a, commitment_usd: o.c, disbursement_usd: o.d, top_sectors: o.ts, themes: o.th, ref: o.n, has_financials: o.hf !== false }; }),
    sectors: _RAW.sectors.map(function (s) { return { sector: s.s, activities: s.a, commitment_usd: s.c, disbursement_usd: s.d }; }),
    yearly: _RAW.yearly.map(function (y) { return { year: y.y, commitment_usd: y.c, disbursement_usd: y.d }; }),
    themes: _RAW.themes.map(function (t) { return { id: t.id, label: t.label, activities: t.a, commitment_usd: t.c, disbursement_usd: t.d, top_orgs: t.to, org_type_split: t.ots, with_results: t.wr || 0, summary: t.sm || '' }; }),
    activities: _RAW.activities.map(function (a) {
      return {
        id: a.i, title: a.t, description: a.ds || '', org: a.o, org_type: a.ot, humanitarian: !!a.h,
        sectors: a.s, themes: a.th || [],
        policy_markers: (a.pm || []).map(function (p) { return { label: p.l, significance: p.s, code: p.c }; }),
        start: a.sd, end: a.ed,
        docs: (a.dc || []).map(function (d) { return { url: d.u, title: d.t, category: d.c }; }),
        results: (a.rs || []).map(function (r) { return { title: r.t, baseline: r.b, target: r.tg, actual: r.ac, baseline_year: r.by, end_date: r.ed }; }),
        commitment_usd: a.c, disbursement_usd: a.d, source_url: a.url, has_financials: a.hf !== false
      };
    })
  };

  var THEME_LABEL = {};
  data.themes.forEach(function (t) { THEME_LABEL[t.id] = t.label; });

  var state = {
    tab: 'overview', selectedTheme: data.themes.length ? data.themes[0].id : null,
    orgSort: 'disbursement', orgTypeFilter: 'all', search: '',
    activitySector: 'all', activityTheme: 'all', activityOrg: 'all',
    activityLimit: 100, modalActivityId: null
  };

  var root = document.getElementById('root');
  function setState(patch) { Object.keys(patch).forEach(function (k) { state[k] = patch[k]; }); render(); }

  function areaChart(series, w, h) {
    var padL = 54, padR = 16, padT = 12, padB = 26;
    var iw = w - padL - padR, ih = h - padT - padB;
    var maxV = 0;
    series.forEach(function (d) { maxV = Math.max(maxV, d.commitment_usd, d.disbursement_usd); });
    if (maxV === 0) maxV = 1;
    function xg(i) { return padL + (series.length <= 1 ? iw/2 : (i / (series.length - 1)) * iw); }
    function yg(v) { return padT + ih - (v / maxV) * ih; }
    function pathFor(key) { return series.map(function (d, i) { return (i === 0 ? 'M' : 'L') + xg(i).toFixed(1) + ',' + yg(d[key]).toFixed(1); }).join(' '); }
    function areaFor(key) {
      var top = series.map(function (d, i) { return (i === 0 ? 'M' : 'L') + xg(i).toFixed(1) + ',' + yg(d[key]).toFixed(1); }).join(' ');
      return top + ' L' + xg(series.length-1).toFixed(1) + ',' + (padT+ih) + ' L' + xg(0).toFixed(1) + ',' + (padT+ih) + ' Z';
    }
    var ticks = 4, gridY = '';
    for (var t = 0; t <= ticks; t++) {
      var val = maxV * t / ticks, yy = yg(val);
      gridY += '<line x1="' + padL + '" y1="' + yy.toFixed(1) + '" x2="' + (w-padR) + '" y2="' + yy.toFixed(1) + '" stroke="#d8cfbd" stroke-dasharray="2 4"/>';
      gridY += '<text x="' + (padL-8) + '" y="' + (yy+3).toFixed(1) + '" text-anchor="end" font-size="10" fill="#6b6356" font-family="monospace">' + fmt$(val) + '</text>';
    }
    var xlabels = '';
    series.forEach(function (d, i) {
      if (series.length > 12 && i % 2 !== 0) return;
      xlabels += '<text x="' + xg(i).toFixed(1) + '" y="' + (h-8) + '" text-anchor="middle" font-size="10" fill="#6b6356" font-family="monospace">' + d.year + '</text>';
    });
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="xMidYMid meet">' + gridY +
      '<path d="' + areaFor('commitment_usd') + '" fill="' + hexA('#5b6b8c',0.15) + '"/>' +
      '<path d="' + areaFor('disbursement_usd') + '" fill="' + hexA('#a8321f',0.18) + '"/>' +
      '<path d="' + pathFor('commitment_usd') + '" fill="none" stroke="#5b6b8c" stroke-width="1.5"/>' +
      '<path d="' + pathFor('disbursement_usd') + '" fill="none" stroke="#a8321f" stroke-width="2"/>' + xlabels + '</svg>';
  }

  function treemap(items, w, h) {
    var total = items.reduce(function (s, d) { return s + d.size; }, 0);
    if (total === 0) return '';
    var rects = [];
    (function layout(list, x, y, ww, hh, horizontal) {
      if (list.length === 0) return;
      if (list.length === 1) { rects.push({ d: list[0], x: x, y: y, w: ww, h: hh }); return; }
      var sum = list.reduce(function (s, d) { return s + d.size; }, 0);
      var half = sum / 2, acc = 0, idx = 0;
      for (var i = 0; i < list.length; i++) { acc += list[i].size; idx = i; if (acc >= half) break; }
      var first = list.slice(0, idx + 1), second = list.slice(idx + 1);
      if (second.length === 0) { second = [first.pop()]; }
      var firstSum = first.reduce(function (s, d) { return s + d.size; }, 0);
      var frac = firstSum / sum;
      if (horizontal) { var wS = ww * frac; layout(first, x, y, wS, hh, !horizontal); layout(second, x + wS, y, ww - wS, hh, !horizontal); }
      else { var hS = hh * frac; layout(first, x, y, ww, hS, !horizontal); layout(second, x, y + hS, ww, hh - hS, !horizontal); }
    })(items.slice(), 0, 0, w, h, true);
    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="xMidYMid meet">';
    rects.forEach(function (r) {
      svg += '<rect x="' + r.x.toFixed(1) + '" y="' + r.y.toFixed(1) + '" width="' + Math.max(0,r.w-2).toFixed(1) + '" height="' + Math.max(0,r.h-2).toFixed(1) + '" fill="' + r.d.fill + '"/>';
      if (r.w > 70 && r.h > 34) svg += '<text x="' + (r.x+8).toFixed(1) + '" y="' + (r.y+18).toFixed(1) + '" font-size="11" font-weight="600" fill="#faf6ec" font-family="Georgia,serif">' + esc(clip(r.d.name, Math.floor(r.w/7))) + '</text>';
      if (r.w > 100 && r.h > 54) svg += '<text x="' + (r.x+8).toFixed(1) + '" y="' + (r.y+35).toFixed(1) + '" font-size="11" fill="#faf6ec" opacity="0.85" font-family="monospace">' + fmt$(r.d.size) + '</text>';
    });
    return svg + '</svg>';
  }

  function sectionTitle(kicker, title) { return '<div class="section-title"><div class="kicker">' + esc(kicker) + '</div><h2>' + esc(title) + '</h2></div>'; }
  function statCell(label, value, sub) { return '<div class="stat-cell"><div class="kicker-mono" style="margin-bottom:8px">' + esc(label) + '</div><div class="stat-value">' + esc(value) + '</div><div class="stat-sub">' + esc(sub) + '</div></div>'; }

  function activityCardHTML(a, idx) {
    var tags = '';
    if (a.humanitarian) tags += '<span class="tag" style="background:var(--accent);color:var(--paper)">HUM</span> ';
    if (a.results && a.results.length) tags += '<span class="tag" style="background:var(--accent3);color:var(--paper)">RESULTS</span> ';
    if (!a.has_financials) tags += '<span class="tag" style="background:var(--muted);color:var(--paper)">NO $ DATA</span> ';
    (a.themes || []).slice(0,2).forEach(function (tid) { tags += '<span class="tag" style="background:' + hexA(color(THEME_COLORS,tid),0.13) + ';color:' + color(THEME_COLORS,tid) + '">' + esc(THEME_LABEL[tid]||tid) + '</span> '; });
    var timeline = a.start ? (' · <span class="mono">' + esc(a.start.slice(0,7)) + (a.end ? ' → ' + esc(a.end.slice(0,7)) : '') + '</span>') : '';
    var val = Math.max(a.commitment_usd, a.disbursement_usd);
    var valBlock = a.has_financials
      ? '<div class="mono" style="font-size:13px;color:var(--accent);font-weight:600">' + fmt$(val) + '</div><div class="mono" style="font-size:10px;color:var(--muted);margin-top:2px">' + (a.disbursement_usd > 0 ? 'disbursed' : 'committed') + '</div>'
      : '<div class="mono" style="font-size:11px;color:var(--muted);font-style:italic">not reported</div>';
    return '<button class="act-card" data-actidx="' + idx + '"><div><div style="margin-bottom:6px">' +
      '<span class="mono" style="font-size:10px;color:var(--muted);letter-spacing:0.05em">' + esc(clip(a.id,40)) + '</span> ' + tags + '</div>' +
      '<div class="act-title">' + esc(a.title || '(no title)') + '</div>' +
      '<div class="act-meta"><strong>' + esc(a.org) + '</strong> · <span class="mono">' + esc(a.org_type) + '</span>' + timeline + '</div></div>' +
      '<div style="text-align:right;min-width:110px">' + valBlock + '</div></button>';
  }

  function renderOverview() {
    var treemapData = data.sectors.filter(function (s) { return s.disbursement_usd > 0; }).map(function (s) { return { name: s.sector, size: s.disbursement_usd, fill: color(SECTOR_COLORS, s.sector) }; });
    var themeList = data.themes.slice(0,10).map(function (t) {
      return '<button class="theme-jump" data-theme="' + t.id + '" style="display:block;width:100%;text-align:left;padding:10px 0;border:none;border-bottom:1px dotted var(--rule);background:none;color:var(--ink)">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><div style="font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:' + color(THEME_COLORS,t.id) + '"></span>' + esc(t.label) + '</div><span class="muted" style="font-size:12px">→</span></div>' +
        '<div class="mono" style="font-size:10px;color:var(--muted);margin-left:16px;margin-top:2px">' + t.activities + ' acts · ' + fmt$(t.disbursement_usd) + ' disbursed</div></button>';
    }).join('');
    var funders = data.orgs.slice(0,8).map(function (o, i) {
      return '<div style="padding:10px 0;border-bottom:' + (i<7?'1px dotted var(--rule)':'none') + '"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">' +
        '<div style="font-size:13px;font-weight:600"><span class="mono" style="color:var(--muted);font-size:10px;margin-right:6px">' + String(i+1).padStart(2,'0') + '</span>' + esc(o.name) + '</div>' +
        '<div class="mono" style="font-size:12px;color:var(--accent);white-space:nowrap">' + fmt$(o.disbursement_usd) + '</div></div>' +
        '<div class="mono" style="font-size:10px;color:var(--muted);margin-left:22px;margin-top:2px">' + esc(o.type) + ' · ' + o.activities + ' activities</div></div>';
    }).join('');
    return '<div class="grid-2col"><div>' + sectionTitle('Section 01', 'Disbursements over time') +
      '<p style="font-size:14px;color:var(--muted);line-height:1.6;max-width:620px;margin-bottom:20px">Aggregated transactions reported to IATI for Bangladesh, USD-equivalent at indicative rates. The pre-2017 dip reflects sparse early reporting, not actual flows.</p>' +
      '<div class="panel" style="padding:20px">' + areaChart(data.yearly, 640, 300) +
      '<div style="display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px;justify-content:center">' +
      '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:4px;background:#a8321f;display:inline-block"></span><span class="mono" style="font-size:11px">Disbursements</span></span>' +
      '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:4px;background:#5b6b8c;display:inline-block"></span><span class="mono" style="font-size:11px">Commitments</span></span></div></div>' +
      '<div style="margin-top:36px">' + sectionTitle('Section 02', 'Where the money goes — by sector') +
      '<p style="font-size:14px;color:var(--muted);line-height:1.6;max-width:620px;margin-bottom:20px">Disbursements grouped by DAC sector family. The large "Other / Unspecified" block is itself a finding.</p>' +
      '<div class="panel" style="padding:20px">' + treemap(treemapData, 640, 340) + '</div></div></div>' +
      '<aside>' + sectionTitle('Sidebar', 'Themes for positioning') +
      '<p style="font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:16px">Tap a theme to see who\'s doing what — and read the pre-baked positioning note.</p>' +
      '<div class="panel" style="padding:16px;margin-bottom:24px">' + themeList + '</div>' +
      sectionTitle('Top funders', 'By USD-equivalent disbursement') + '<div class="panel" style="padding:20px">' + funders + '</div></aside></div>';
  }

  function renderTopics() {
    var theme = data.themes.filter(function (t) { return t.id === state.selectedTheme; })[0];
    var themeActs = data.activities.filter(function (a) { return a.themes.indexOf(state.selectedTheme) !== -1; })
      .sort(function (a,b) { return Math.max(b.commitment_usd,b.disbursement_usd) - Math.max(a.commitment_usd,a.disbursement_usd); });
    var m = {};
    themeActs.forEach(function (a) {
      if (!m[a.org]) m[a.org] = { name: a.org, type: a.org_type, activities: 0, disbursement: 0, commitment: 0, examples: [] };
      m[a.org].activities += 1; m[a.org].disbursement += a.disbursement_usd; m[a.org].commitment += a.commitment_usd;
      if (m[a.org].examples.length < 2) m[a.org].examples.push(a.title);
    });
    var donors = Object.keys(m).map(function (k) { return m[k]; }).sort(function (a,b) { return Math.max(b.disbursement,b.commitment) - Math.max(a.disbursement,a.commitment); });
    var themeNav = data.themes.map(function (t) {
      var active = t.id === state.selectedTheme;
      return '<button class="theme-btn' + (active?' active':'') + '" data-theme="' + t.id + '" style="border-left-color:' + (active?color(THEME_COLORS,t.id):'transparent') + '">' +
        '<div style="font-size:13px;font-weight:600;line-height:1.3">' + esc(t.label) + '</div><div class="mono" style="font-size:10px;color:var(--muted);margin-top:2px">' + t.activities + ' acts · ' + fmt$(t.disbursement_usd) + '</div></button>';
    }).join('');
    var detail = '';
    if (theme) {
      var resultsPct = theme.activities ? (theme.with_results / theme.activities * 100) : 0;
      var summaryBlock = theme.summary ? ('<div style="margin-top:16px;padding:14px 16px;background:var(--bg);border-left:3px solid ' + color(THEME_COLORS,theme.id) + '"><div class="kicker-mono" style="margin-bottom:6px">Positioning note</div><p style="font-size:13px;line-height:1.6;margin:0;color:var(--ink)">' + esc(theme.summary) + '</p></div>') : '';
      var otSplit = Object.keys(theme.org_type_split).map(function (k) { return [k, theme.org_type_split[k]]; }).sort(function (a,b) { return b[1]-a[1]; })
        .map(function (kv) { return '<span class="pill" style="background:' + hexA(color(ORG_TYPE_COLORS,kv[0]),0.13) + ';color:' + color(ORG_TYPE_COLORS,kv[0]) + '">' + esc(kv[0]) + ' · ' + kv[1] + '</span>'; }).join(' ');
      var statsGrid = [
        ['Activities (top slice)', fmtNum(themeActs.length), 'in this material slice'],
        ['Activities (full data)', fmtNum(theme.activities), 'theme-tagged in full dataset'],
        ['Committed', fmt$(theme.commitment_usd), 'USD eq., apportioned'],
        ['Disbursed', fmt$(theme.disbursement_usd), 'USD eq., apportioned'],
        ['Results coverage', resultsPct.toFixed(0) + '%', 'activities w/ any indicator']
      ].map(function (s) { return '<div><div class="kicker-mono" style="font-size:9px;margin-bottom:4px">' + esc(s[0]) + '</div><div class="mono" style="font-size:22px;font-weight:600;line-height:1">' + esc(s[1]) + '</div><div style="font-size:10px;color:var(--muted);margin-top:4px;font-style:italic">' + esc(s[2]) + '</div></div>'; }).join('');
      var donorHTML = donors.length === 0 ?
        '<div style="padding:24px;font-size:13px;color:var(--muted);font-style:italic">No material activities in the top slice for this theme. The full data has ' + theme.activities + ' tagged below the threshold.</div>' :
        donors.slice(0,12).map(function (d, i) {
          var eg = d.examples[0] ? '<div style="font-size:12px;color:var(--muted);font-style:italic;margin-top:6px;line-height:1.4">e.g. ' + esc(clip(d.examples[0],90)) + '</div>' : '';
          return '<div style="padding:14px 20px;border-bottom:' + (i<Math.min(donors.length,12)-1?'1px dotted var(--rule)':'none') + '"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><div style="flex:1"><div style="font-size:14px;font-weight:600;line-height:1.3">' + esc(d.name) + '</div><div class="mono" style="font-size:11px;color:var(--muted);margin-top:3px"><span class="pill" style="background:' + hexA(color(ORG_TYPE_COLORS,d.type),0.13) + ';color:' + color(ORG_TYPE_COLORS,d.type) + ';margin-right:8px">' + esc(d.type) + '</span>' + d.activities + (d.activities===1?' activity':' activities') + '</div>' + eg + '</div><div style="text-align:right;min-width:100px"><div class="mono" style="font-size:13px;color:var(--accent);font-weight:600">' + fmt$(Math.max(d.disbursement,d.commitment)) + '</div><div class="mono" style="font-size:10px;color:var(--muted);margin-top:2px">' + (d.disbursement>0?'disbursed':'committed') + '</div></div></div></div>';
        }).join('');
      var actListHTML = themeActs.slice(0,40).map(function (a) { return activityCardHTML(a, data.activities.indexOf(a)); }).join('');
      var moreNote = themeActs.length > 40 ? '<p style="font-size:11px;color:var(--muted);margin-top:12px;font-style:italic">Showing top 40 of ' + themeActs.length + '. Use the Activities tab with the theme filter to see all.</p>' : '';
      detail = '<div><div class="panel" style="padding:24px 28px;margin-bottom:24px"><div style="display:flex;align-items:baseline;gap:12px;margin-bottom:6px"><span style="width:14px;height:14px;background:' + color(THEME_COLORS,theme.id) + '"></span><h2 style="font-size:26px;font-weight:600;margin:0;letter-spacing:-0.01em;line-height:1.1">' + esc(theme.label) + '</h2></div>' + summaryBlock +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;margin-top:20px">' + statsGrid + '</div>' +
        '<div style="margin-top:20px;padding-top:16px;border-top:1px dotted var(--rule)"><div class="kicker-mono" style="margin-bottom:8px">Reporter mix</div><div style="display:flex;gap:8px;flex-wrap:wrap">' + otSplit + '</div></div></div>' +
        '<div style="margin-bottom:28px"><h3 style="font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:12px">Who\'s active here · ' + donors.length + ' reporters in material activities</h3><div class="panel">' + donorHTML + '</div></div>' +
        '<div><h3 style="font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:12px">Activities in this theme · ' + themeActs.length + ' (click to drill in)</h3><div style="display:grid;gap:10px">' + actListHTML + '</div>' + moreNote + '</div></div>';
    }
    return '<div>' + sectionTitle('Topic explorer', "Who's doing what — by theme") +
      '<p style="font-size:14px;color:var(--muted);line-height:1.6;max-width:720px;margin-bottom:24px">Themes are inferred from titles, descriptions, sector codes, and policy markers. Pick a theme to see the donor landscape, a pre-baked positioning summary, and individual activities.</p>' +
      '<div class="grid-topics"><div class="panel" style="position:sticky;top:16px"><div class="kicker-mono" style="padding:12px 16px;border-bottom:1px solid var(--rule)">Themes · ' + data.themes.length + '</div><div style="max-height:640px;overflow-y:auto">' + themeNav + '</div></div>' + detail + '</div></div>';
  }

  function renderSectors() {
    var totalDisb = data.sectors.reduce(function (a, s) { return a + s.disbursement_usd; }, 0);
    var rows = data.sectors.map(function (s) {
      var pct = totalDisb > 0 ? (s.disbursement_usd/totalDisb*100) : 0;
      return '<tr style="border-bottom:1px solid var(--rule)"><td><div style="display:flex;align-items:center;gap:10px"><span style="width:8px;height:24px;background:' + color(SECTOR_COLORS,s.sector) + '"></span><span style="font-weight:600">' + esc(s.sector) + '</span></div></td>' +
        '<td class="right mono" style="font-size:12px">' + fmtNum(s.activities) + '</td><td class="right mono" style="font-size:12px;color:var(--muted)">' + fmt$(s.commitment_usd) + '</td><td class="right mono" style="font-size:12px;color:var(--accent);font-weight:600">' + fmt$(s.disbursement_usd) + '</td>' +
        '<td class="right" style="width:140px"><div style="display:flex;align-items:center;gap:8px;justify-content:flex-end"><div class="bar-track" style="flex:1;max-width:80px"><div class="bar-fill" style="width:' + pct + '%;background:' + color(SECTOR_COLORS,s.sector) + '"></div></div><span class="mono" style="font-size:11px;color:var(--muted);min-width:36px">' + pct.toFixed(1) + '%</span></div></td></tr>';
    }).join('');
    return '<div>' + sectionTitle('Detailed view', 'Sector breakdown') +
      '<p style="font-size:14px;color:var(--muted);line-height:1.6;max-width:720px;margin-bottom:24px">Disbursements and activity counts by DAC sector family. Multi-sector activities are split proportionally.</p>' +
      '<div class="panel"><table><thead><tr style="border-bottom:2px solid var(--ink);background:var(--bg)"><th>Sector</th><th class="right">Activities</th><th class="right">Committed</th><th class="right">Disbursed</th><th class="right">Share</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }

  function renderOrgs() {
    var list = data.orgs.filter(function (o) {
      if (state.orgTypeFilter !== 'all' && o.type !== state.orgTypeFilter) return false;
      if (state.search && o.name.toLowerCase().indexOf(state.search.toLowerCase()) === -1) return false;
      return true;
    });
    if (state.orgSort === 'disbursement') list.sort(function (a,b) { return b.disbursement_usd - a.disbursement_usd; });
    if (state.orgSort === 'commitment') list.sort(function (a,b) { return b.commitment_usd - a.commitment_usd; });
    if (state.orgSort === 'activities') list.sort(function (a,b) { return b.activities - a.activities; });
    if (state.orgSort === 'name') list.sort(function (a,b) { return a.name.localeCompare(b.name); });
    var rows = list.map(function (o, i) {
      var moneyCells = o.has_financials
        ? '<td class="right mono" style="font-size:12px;color:var(--muted)">' + fmt$(o.commitment_usd) + '</td><td class="right mono" style="font-size:12px;color:var(--accent);font-weight:600">' + fmt$(o.disbursement_usd) + '</td>'
        : '<td class="right mono" style="font-size:11px;color:var(--muted);font-style:italic">not reported</td><td class="right mono" style="font-size:11px;color:var(--muted);font-style:italic">not reported</td>';
      var nameBadge = o.has_financials ? '' : ' <span class="tag" style="background:var(--muted);color:var(--paper)">NO $ DATA</span>';
      return '<tr style="border-bottom:1px dotted var(--rule)"><td class="mono" style="font-size:11px;color:var(--muted)">' + (i+1) + '</td><td style="font-weight:600;max-width:280px">' + esc(o.name) + nameBadge + '</td>' +
        '<td><span class="pill" style="background:' + hexA(color(ORG_TYPE_COLORS,o.type),0.13) + ';color:' + color(ORG_TYPE_COLORS,o.type) + '">' + esc(o.type) + '</span></td>' +
        '<td class="right mono" style="font-size:12px">' + o.activities + '</td>' + moneyCells +
        '<td style="font-size:11px;color:var(--muted);max-width:240px">' + esc((o.top_sectors||[]).slice(0,2).join(' · ')) + '</td></tr>';
    }).join('');
    var typeOptions = ['<option value="all">All organisation types</option>'].concat(Object.keys(ORG_TYPE_COLORS).map(function (t) { return '<option value="' + esc(t) + '"' + (state.orgTypeFilter===t?' selected':'') + '>' + esc(t) + '</option>'; })).join('');
    var sortOptions = [['disbursement','Sort by disbursement'],['commitment','Sort by commitment'],['activities','Sort by activity count'],['name','Sort A–Z']].map(function (o) { return '<option value="' + o[0] + '"' + (state.orgSort===o[0]?' selected':'') + '>' + o[1] + '</option>'; }).join('');
    return '<div>' + sectionTitle('Detailed view', 'Reporting organisations') +
      '<div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center"><div style="flex:1;min-width:240px"><input id="orgSearch" placeholder="Search organisations…" value="' + esc(state.search) + '" style="width:100%"></div>' +
      '<select id="orgTypeFilter">' + typeOptions + '</select><select id="orgSort">' + sortOptions + '</select></div>' +
      '<div class="panel" style="max-height:600px;overflow-y:auto"><table><thead style="position:sticky;top:0;background:var(--bg);z-index:1"><tr style="border-bottom:2px solid var(--ink)"><th>#</th><th>Organisation</th><th>Type</th><th class="right">Activities</th><th class="right">Committed</th><th class="right">Disbursed</th><th>Top sectors</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p style="font-size:11px;color:var(--muted);margin-top:12px;font-style:italic">Showing ' + fmtNum(list.length) + ' of ' + fmtNum(data.orgs.length) + ' organisations. Search by name or filter by type. Organisations with no transaction data in the export are labelled "NO $ DATA" — their activities are still browsable via the Activities tab.</p></div>';
  }

  function renderActivities() {
    var list = data.activities.filter(function (a) {
      if (state.activitySector !== 'all' && a.sectors.indexOf(state.activitySector) === -1) return false;
      if (state.activityTheme !== 'all' && a.themes.indexOf(state.activityTheme) === -1) return false;
      if (state.activityOrg !== 'all' && a.org !== state.activityOrg) return false;
      if (state.search) { var q = state.search.toLowerCase(); if (a.title.toLowerCase().indexOf(q) === -1 && a.org.toLowerCase().indexOf(q) === -1 && a.description.toLowerCase().indexOf(q) === -1) return false; }
      return true;
    });
    var limit = state.activityLimit || 100;
    var shown = list.slice(0, limit);
    var cards = shown.map(function (a) { return activityCardHTML(a, data.activities.indexOf(a)); }).join('');
    var themeOptions = ['<option value="all">All themes</option>'].concat(data.themes.map(function (t) { return '<option value="' + t.id + '"' + (state.activityTheme===t.id?' selected':'') + '>' + esc(t.label) + '</option>'; })).join('');
    var sectorOptions = ['<option value="all">All sectors</option>'].concat(data.sectors.map(function (s) { return '<option value="' + esc(s.sector) + '"' + (state.activitySector===s.sector?' selected':'') + '>' + esc(s.sector) + '</option>'; })).join('');
    // Org filter — sorted alphabetically for scannability
    var orgsSorted = data.orgs.slice().sort(function (a,b) { return a.name.localeCompare(b.name); });
    var orgOptions = ['<option value="all">All organisations</option>'].concat(orgsSorted.map(function (o) { return '<option value="' + esc(o.name) + '"' + (state.activityOrg===o.name?' selected':'') + '>' + esc(o.name) + ' (' + o.activities + ')</option>'; })).join('');

    var moreBtn = list.length > shown.length
      ? '<button id="actLoadMore" style="margin-top:16px;padding:10px 24px;background:var(--ink);color:var(--paper);border:none;font-size:13px;cursor:pointer;font-family:inherit">Load next 200 (' + (list.length - shown.length) + ' remaining)</button>'
      : '';

    var activeFilterNote = '';
    if (state.activityOrg !== 'all') {
      var orgObj = data.orgs.filter(function (o) { return o.name === state.activityOrg; })[0];
      if (orgObj) {
        activeFilterNote = '<div style="margin-bottom:16px;padding:14px 16px;background:var(--bg);border-left:3px solid var(--accent);font-size:13px;line-height:1.5">' +
          '<strong>Filtered to:</strong> ' + esc(orgObj.name) +
          ' <span class="pill" style="background:' + hexA(color(ORG_TYPE_COLORS,orgObj.type),0.13) + ';color:' + color(ORG_TYPE_COLORS,orgObj.type) + ';margin-left:6px">' + esc(orgObj.type) + '</span>' +
          (orgObj.has_financials === false ? ' <span class="tag" style="background:var(--muted);color:var(--paper);margin-left:6px">NO $ DATA IN THIS EXPORT</span>' : '') +
          '<div style="margin-top:6px;color:var(--muted);font-size:12px">' + orgObj.activities + ' total activities in the dataset · ' +
          (orgObj.has_financials ? fmt$(orgObj.disbursement_usd) + ' disbursed · ' + fmt$(orgObj.commitment_usd) + ' committed' : 'No financial transactions reported in the IATI export — activity records only') +
          '</div></div>';
      }
    }

    return '<div>' + sectionTitle('Detailed view', 'Activity browser') +
      '<p style="font-size:14px;color:var(--muted);line-height:1.6;max-width:720px;margin-bottom:20px">All ' + fmtNum(data.activities.length) + ' activities in the dataset. Filter by organisation, theme, or sector; search title, description, or organisation. Click any activity for the full record and a direct link to its IATI source.</p>' +
      '<div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap"><div style="flex:1;min-width:240px"><input id="actSearch" placeholder="Search title, description, or organisation…" value="' + esc(state.search) + '" style="width:100%"></div>' +
      '<select id="actOrg" style="max-width:280px">' + orgOptions + '</select>' +
      '<select id="actTheme">' + themeOptions + '</select><select id="actSector">' + sectorOptions + '</select></div>' +
      activeFilterNote +
      '<div style="display:grid;gap:10px">' + cards + '</div>' +
      '<p style="font-size:11px;color:var(--muted);margin-top:16px;font-style:italic">Showing ' + fmtNum(shown.length) + ' of ' + fmtNum(list.length) + ' matching activities.</p>' +
      moreBtn + '</div>';
  }

  function renderCaveats() {
    var items = [
      ['Many major bilateral donors publish activities with no transaction values', 'Over 130 organisations in this dataset — including large publishers like Germany (BMZ), Finland MFA, the EU\'s DG INTPA, Norad, and Sweden — have activity records in IATI with empty transaction fields. This is a gap in what they publish to the IATI Datastore, not evidence of low or no funding. The dashboard flags these with a "NO $ DATA" label instead of a misleading $0, and includes all of them in the Organisations and Activities listings. Use the organisation filter on the Activities tab to see a specific donor\'s work.'],
      ['Themes are inferred, not authoritative', 'Activity-to-theme matching uses keyword search, sector codes, and policy markers. Expect some false positives and negatives — sanity-check before using for positioning decisions.'],
      ['Results data is sparse and self-reported', 'Only about 18% of activity rows in this dataset publish any result indicator. Coverage skews toward World Bank-linked projects (via AidData) and a handful of well-resourced reporters. Absence of results data does not mean absence of results. Treat the per-theme "results coverage" figure as a floor on transparency, not a measure of performance.'],
      ['Source links go to d-portal, a public IATI viewer', 'Every activity links out to d-portal.org, a standard independent viewer for IATI data, where you can see the full unprocessed record. This is the authoritative source to verify or cite a figure.'],
      ['Positioning summaries are pre-baked, not AI-generated per visit', 'Theme summaries are computed at data-refresh time from the underlying numbers, combined with a hand-written one-sentence positioning angle per theme. They update automatically when the data refreshes; the framing changes only when someone edits the source script.'],
      ['SDC dominates by reporting volume, not by money', 'Swiss SDC publishes very granular activity rows for Bangladesh. High activity counts in many themes reflect reporting practice, not necessarily larger actual programmes. Cross-reference with disbursement figures.'],
      ['Currency conversion is indicative', 'All values are converted at single illustrative FX rates rather than period-specific rates. Treat USD totals as orders of magnitude.'],
      ['Major donors absent or underrepresented in raw data', 'World Bank/IDA, ADB, JICA and KfW are underrepresented relative to their actual footprint. JICA publishes some activities in Japanese only. AidData provides World Bank project shadows via research aggregation, not direct funding.']
    ];
    var body = items.map(function (it) { return '<h3>' + esc(it[0]) + '</h3><p>' + esc(it[1]) + '</p>'; }).join('');
    return '<div style="max-width:720px">' + sectionTitle('Methodology', 'Caveats and known limits') + '<div class="prose">' + body + '</div></div>';
  }

  function modalSection(title, inner) { return '<div style="margin-bottom:24px"><h3 class="kicker-mono" style="font-size:11px;margin-bottom:10px">' + esc(title) + '</h3>' + inner + '</div>'; }

  function renderModal() {
    if (state.modalActivityId === null) return '';
    var a = data.activities[state.modalActivityId];
    if (!a) return '';
    var badges = '<span class="pill" style="background:' + hexA(color(ORG_TYPE_COLORS,a.org_type),0.13) + ';color:' + color(ORG_TYPE_COLORS,a.org_type) + '">' + esc(a.org_type) + '</span>';
    if (a.humanitarian) badges += ' <span class="pill" style="background:var(--accent);color:var(--paper)">HUMANITARIAN</span>';
    if (a.source_url) badges += ' <a href="' + esc(a.source_url) + '" target="_blank" rel="noopener" class="pill" style="background:var(--ink);color:var(--paper);text-decoration:none">View on IATI ↗</a>';
    var sections = '';
    if (a.description) sections += modalSection('Description', '<p style="font-size:14px;line-height:1.6;color:var(--ink);margin:0">' + esc(a.description) + (a.description.length >= 270 ? '…' : '') + '</p>');
    if (a.results && a.results.length) {
      var rHTML = a.results.map(function (r) {
        var hasAll = r.baseline !== null && r.target !== null && r.actual !== null;
        var pct = null;
        if (hasAll && r.target !== r.baseline) pct = Math.max(0, Math.min(150, ((r.actual - r.baseline)/(r.target - r.baseline))*100));
        var barColor = pct === null ? '' : (pct >= 90 ? 'var(--accent3)' : pct >= 50 ? 'var(--accent2)' : 'var(--accent)');
        var bar = pct !== null ? '<div class="bar-track" style="margin-top:6px"><div class="bar-fill" style="width:' + Math.min(pct,100) + '%;background:' + barColor + '"></div></div>' : '';
        return '<div style="padding:10px 12px;background:var(--bg);border:1px solid var(--rule)"><div style="font-size:12px;font-weight:600;margin-bottom:6px">' + esc(r.title) + '</div><div class="mono" style="display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted)"><span>Baseline (' + esc(r.baseline_year||'—') + '): <strong style="color:var(--ink)">' + fmtCompact(r.baseline) + '</strong></span><span>Target: <strong style="color:var(--ink)">' + fmtCompact(r.target) + '</strong></span><span>Actual' + (r.end_date ? ' (' + esc(r.end_date.slice(0,7)) + ')' : '') + ': <strong style="color:var(--accent)">' + fmtCompact(r.actual) + '</strong></span></div>' + bar + '</div>';
      }).join('');
      sections += modalSection('Results (' + a.results.length + ' indicator' + (a.results.length>1?'s':'') + ')', '<div style="display:grid;gap:8px">' + rHTML + '</div><p style="font-size:11px;color:var(--muted);font-style:italic;margin:8px 0 0">As self-reported by the publisher in IATI. No independent verification.</p>');
    }
    if (a.themes && a.themes.length) {
      var tHTML = a.themes.map(function (tid) { return '<button class="modal-theme-jump mono" data-theme="' + tid + '" style="font-size:12px;padding:4px 10px;background:' + hexA(color(THEME_COLORS,tid),0.13) + ';color:' + color(THEME_COLORS,tid) + ';border:1px solid ' + hexA(color(THEME_COLORS,tid),0.25) + '">' + esc(THEME_LABEL[tid]||tid) + ' →</button>'; }).join(' ');
      sections += modalSection('Themes', '<div style="display:flex;flex-wrap:wrap;gap:6px">' + tHTML + '</div>');
    }
    if (a.sectors && a.sectors.length) {
      var sHTML = a.sectors.map(function (s) { return '<span class="pill" style="font-size:12px;padding:4px 10px;background:' + hexA(color(SECTOR_COLORS,s),0.13) + ';color:' + color(SECTOR_COLORS,s) + '">' + esc(s) + '</span>'; }).join(' ');
      sections += modalSection('Sectors', '<div style="display:flex;flex-wrap:wrap;gap:6px">' + sHTML + '</div>');
    }
    if (a.policy_markers && a.policy_markers.length) {
      var pmHTML = a.policy_markers.map(function (pm) { return '<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;padding:6px 12px;background:var(--bg);border:1px solid var(--rule)"><span style="font-weight:600">' + esc(pm.label) + '</span><span class="mono" style="font-size:11px;color:var(--muted)">' + esc(pm.significance) + '</span></div>'; }).join('');
      sections += modalSection('Policy markers (OECD-DAC)', '<div style="display:grid;gap:6px">' + pmHTML + '</div>');
    }
    if (a.docs && a.docs.length) {
      var dHTML = a.docs.map(function (d) { return '<a href="' + esc(d.url) + '" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--rule);color:var(--ink);text-decoration:none;font-size:12px"><div style="flex:1;min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(d.title || '(untitled document)') + '</div>' + (d.category ? '<div class="mono" style="font-size:10px;color:var(--muted);margin-top:2px">' + esc(d.category) + '</div>' : '') + '</div><span class="muted" style="font-size:11px">↗</span></a>'; }).join('');
      sections += modalSection('Documents', '<div style="display:grid;gap:6px">' + dHTML + '</div>');
    }
    sections += modalSection('Source', '<a href="' + esc(a.source_url) + '" target="_blank" rel="noopener" class="mono" style="display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:var(--ink);color:var(--paper);text-decoration:none;font-size:13px">View full activity record on IATI (d-portal) ↗</a>');
    return '<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"><div style="padding:28px 32px 20px;border-bottom:1px solid var(--rule);position:relative"><button class="modal-close" id="modalClose">×</button><div class="kicker">Activity detail</div><div class="mono" style="font-size:10px;color:var(--muted);margin:8px 0 12px;word-break:break-all">' + esc(a.id) + '</div><h2 style="font-size:24px;font-weight:600;margin:0;line-height:1.25;letter-spacing:-0.01em;padding-right:40px">' + esc(a.title || '(no title)') + '</h2><div style="margin-top:12px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap"><strong style="color:var(--ink)">' + esc(a.org) + '</strong> ' + badges + '</div></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--rule)"><div style="padding:14px 32px;border-right:1px solid var(--rule)"><div class="kicker-mono">Committed</div><div class="mono" style="' + (a.has_financials ? 'font-size:18px;font-weight:600;margin-top:4px' : 'font-size:13px;color:var(--muted);font-style:italic;margin-top:4px') + '">' + (a.has_financials ? fmt$(a.commitment_usd) : 'not reported') + '</div></div><div style="padding:14px 32px;border-right:1px solid var(--rule)"><div class="kicker-mono">Disbursed</div><div class="mono" style="' + (a.has_financials ? 'font-size:18px;font-weight:600;margin-top:4px;color:var(--accent)' : 'font-size:13px;color:var(--muted);font-style:italic;margin-top:4px') + '">' + (a.has_financials ? fmt$(a.disbursement_usd) : 'not reported') + '</div></div><div style="padding:14px 32px"><div class="kicker-mono">Timeline</div><div class="mono" style="font-size:14px;font-weight:600;margin-top:4px">' + (a.start?esc(a.start.slice(0,7)):'—') + ' → ' + (a.end?esc(a.end.slice(0,7)):'—') + '</div></div></div>' +
      '<div style="padding:24px 32px 32px">' + sections + '</div></div></div>';
  }

  function render() {
    var tabs = [['overview','Overview'],['topics','Topics'],['sectors','Sectors'],['orgs','Organisations'],['activities','Activities'],['notes','Caveats']];
    var tabHTML = tabs.map(function (t) { return '<button data-tab="' + t[0] + '" class="' + (state.tab===t[0]?'active':'') + '">' + t[1] + '</button>'; }).join('');
    var statsHTML = [
      statCell('Reporting organisations', fmtNum(data.summary.unique_orgs), 'distinct entities'),
      statCell('Activities tracked', fmtNum(data.summary.unique_activities), 'unique IATI IDs'),
      statCell('Total committed', fmt$(data.summary.total_commitment_usd), 'cumulative, USD eq.'),
      statCell('Total disbursed', fmt$(data.summary.total_disbursement_usd), 'cumulative, USD eq.'),
      statCell('No $ data reported', fmtNum(data.summary.orgs_without_financials || 0), 'orgs with activities but no transactions')
    ].join('');
    var body = '';
    if (state.tab === 'overview') body = renderOverview();
    else if (state.tab === 'topics') body = renderTopics();
    else if (state.tab === 'sectors') body = renderSectors();
    else if (state.tab === 'orgs') body = renderOrgs();
    else if (state.tab === 'activities') body = renderActivities();
    else if (state.tab === 'notes') body = renderCaveats();
    root.innerHTML =
      '<header class="masthead"><div class="mast-row"><div><div class="kicker-mono" style="color:var(--accent);margin-bottom:8px">IATI · Bangladesh · Donor & Activity Atlas</div><h1 class="title">Who is doing what<br><em>in Bangladesh.</em></h1></div>' +
      '<div class="mono" style="font-size:11px;color:var(--muted);text-align:right;line-height:1.6"><div>Source · IATI Datastore</div><div>Records · ' + fmtNum(data.summary.total_rows) + ' activity rows</div><div>Updated · ' + esc(data.summary.generated_at||'—') + '</div></div></div></header>' +
      '<section class="stats">' + statsHTML + '</section><nav class="tabs">' + tabHTML + '</nav><main>' + body + '</main>' +
      '<footer><span>IATI Bangladesh Atlas · v3.1 · vanilla build, no dependencies</span><span>Total rows: ' + fmtNum(data.summary.total_rows) + ' · Activity detail: top ' + data.activities.length + ' by value</span></footer>' +
      renderModal();
    attachHandlers();
  }

  function attachHandlers() {
    Array.prototype.forEach.call(root.querySelectorAll('nav.tabs button'), function (b) { b.onclick = function () { setState({ tab: b.getAttribute('data-tab') }); window.scrollTo(0,0); }; });
    Array.prototype.forEach.call(root.querySelectorAll('.theme-jump, .theme-btn, .modal-theme-jump'), function (b) { b.onclick = function () { setState({ selectedTheme: b.getAttribute('data-theme'), tab: 'topics', modalActivityId: null }); window.scrollTo(0,0); }; });
    Array.prototype.forEach.call(root.querySelectorAll('.act-card'), function (b) { b.onclick = function () { setState({ modalActivityId: parseInt(b.getAttribute('data-actidx'),10) }); }; });
    var overlay = root.querySelector('#modalOverlay');
    if (overlay) { overlay.onclick = function (e) { if (e.target === overlay) setState({ modalActivityId: null }); }; var cb = root.querySelector('#modalClose'); if (cb) cb.onclick = function () { setState({ modalActivityId: null }); }; }
    wireInput('orgSearch', 'search'); wireSelect('orgTypeFilter', 'orgTypeFilter'); wireSelect('orgSort', 'orgSort');
    wireInput('actSearch', 'search', true); wireSelect('actTheme', 'activityTheme', true); wireSelect('actSector', 'activitySector', true); wireSelect('actOrg', 'activityOrg', true);
    var moreBtn = root.querySelector('#actLoadMore');
    if (moreBtn) moreBtn.onclick = function () { state.activityLimit = (state.activityLimit || 100) + 200; render(); };
  }
  function wireInput(id, key, resetLimit) {
    var el = root.querySelector('#' + id); if (!el) return;
    el.oninput = function () { state[key] = el.value; if (resetLimit) state.activityLimit = 100; var pos = el.selectionStart; render(); var again = root.querySelector('#' + id); if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} } };
  }
  function wireSelect(id, key, resetLimit) { var el = root.querySelector('#' + id); if (!el) return; el.onchange = function () { state[key] = el.value; if (resetLimit) state.activityLimit = 100; render(); }; }

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.modalActivityId !== null) setState({ modalActivityId: null }); });
  render();
})();
</script>
</body>
</html>
